<!DOCTYPE html>
<html lang="en">

<head>
    <title>Reset Password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ cache_bust }}">
</head>

<body>
    <!-- Skip to Main Content Link for Keyboard / Screen Reader Accessibility -->
    <a href="#reset-pw-content" class="skip-link">Skip to main content</a>

    <!-- Navigation Bar -->
    <header class="main-header" role="banner">
        <div class="container header-container">
            <div class="logo">
                <a href="/" aria-label="Al-Hidayet Mission Home" style="display:flex; align-items:center; gap:9px; text-decoration:none;">
                    <img src="{{ logo_url or url_for('static', filename='images/logo.png') }}" alt="Al-Hidayet Mission Crest" class="logo-img">
                    <span class="logo-text">Al-Hidayet <span class="highlight">Mission</span></span>
                </a>
            </div>
            <div class="header-cta">
                <a href="/login/student" class="btn btn-outline">Login</a>
            </div>
        </div>
    </header>

    <div class="glass-container" id="reset-pw-content">
        <h2>Reset Password</h2>
        <p style="color: #ccc;">Enter your new password below.</p>

        <form action="/reset-new-password" method="post">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="new_password" required placeholder="Enter new password">
            </div>

            <button type="submit" class="glass-button">Reset Password</button>
        </form>
    </div>

</body>

</html>
