<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Al-Hidayet Mission (Main Branch)</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ cache_bust }}">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Skip to Main Content Link for Keyboard / Screen Reader Accessibility -->
    <a href="#login-content" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header class="main-header" role="banner">
        <div class="container header-container">
            <div class="logo">
                <a href="/" aria-label="Al-Hidayet Mission Home" style="display:flex; align-items:center; gap:9px; text-decoration:none;">
                    <img src="{{ logo_url or url_for('static', filename='images/logo.png') }}" alt="Al-Hidayet Mission Crest" class="logo-img">
                    <span class="logo-text">Al-Hidayet <span class="highlight">Mission</span></span>
                </a>
            </div>
            <nav class="main-nav" id="mainNav" aria-label="Primary Navigation">
                <a href="/" class="nav-link">Home</a>
                <a href="/#about" class="nav-link">About</a>
                <a href="/services" class="nav-link">Services</a>
                <a href="/gallery" class="nav-link">Gallery</a>
                <a href="/#faq" class="nav-link">FAQ</a>
                <a href="/#contact" class="nav-link">Contact</a>
                <div class="mobile-nav-cta">
                    <a href="/register" class="btn btn-primary" style="width: 100%;">Register</a>
                </div>
            </nav>
            <div class="header-cta">
                <a href="/register" class="btn btn-outline">Register</a>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mainNav">
                <span class="hamburger-box">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </span>
            </button>
        </div>
    </header>

    <!-- Login Section -->
    <div class="auth-section bg-pattern" id="login-content">
        <div class="auth-container">
            <h2>Welcome Back! 👋</h2>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert-danger">
                {{ messages[0] }}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="input-group">
                    <input type="text" name="username" required placeholder="Username">
                </div>

                <div class="input-group">
                    <input type="password" name="password" required placeholder="Password">
                </div>

                <div class="form-actions">
                    <label style="color: #7F8C8D; cursor: pointer;">
                        <input type="checkbox" name="remember" style="width: auto; margin-right: 5px;"> Remember me
                    </label>
                    <a href="/forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn">Login</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Register Now</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/script.js') }}?v={{ cache_bust }}"></script>
</body>

</html>
